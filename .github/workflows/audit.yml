name: Security Audit

on:
  schedule:
    # Every Monday at 07:00 UTC — early enough to act on findings before the week fills up
    - cron: "0 7 * * 1"
  # Also run when dependencies change
  push:
    branches: [main]
    paths:
      - "kanon/package.json"
      - "kanon/bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            kanon/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('kanon/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install
        working-directory: kanon

      - name: Run bun audit
        id: audit
        working-directory: kanon
        run: |
          bun audit --json > audit-results.json 2>/dev/null || true

          # Accepted high/critical advisories, keyed by the vulnerable package.
          # These are transitive dependencies that are NOT part of the shipped
          # runtime surface:
          #   * Everything under `promptfoo` (the eval framework) and
          #     `@codecov` (coverage) — neither is bundled into the compiled
          #     `kanon` binary; they run only in dev/CI.
          #   * `js-yaml` — the remaining high (GHSA-52cp-r559-cp3m,
          #     GHSA-5p4m-2wfm-xmqj) is a quadratic-CPU DoS in YAML merge-key /
          #     !!omap handling reachable only through `gray-matter`, which is
          #     pinned to js-yaml 3.x (safeLoad/safeDump). Kanon parses only
          #     repo-authored frontmatter, not untrusted remote YAML, and Bun
          #     cannot scope an override to gray-matter's nested copy. Tracked
          #     for removal when gray-matter moves off js-yaml 3.x.
          #
          # Any high/critical advisory for a package NOT on this list fails the
          # job. Counting is done per-package from the JSON so it cannot drift
          # from a human-output grep.
          ALLOWED_PKGS='["adm-zip","basic-ftp","brace-expansion","engine.io","fast-uri","fast-xml-builder","form-data","ip-address","js-yaml","protobufjs","sharp","simple-git","socket.io-parser","undici","ws"]'

          # Packages that have at least one high/critical advisory.
          HIGH_PKGS=$(jq -r '[to_entries[]
            | select(.value | any(.severity == "high" or .severity == "critical"))
            | .key] | sort | unique | .[]' audit-results.json 2>/dev/null || true)

          # Actionable = high/critical packages not on the allowlist.
          ACTIONABLE_PKGS=$(comm -23 \
            <(printf '%s\n' "$HIGH_PKGS" | sort -u | sed '/^$/d') \
            <(echo "$ALLOWED_PKGS" | jq -r '.[]' | sort -u))

          if [ -z "$ACTIONABLE_PKGS" ]; then
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            ACCEPTED=$(printf '%s\n' "$HIGH_PKGS" | sed '/^$/d' | wc -l | tr -d ' ')
            echo "::warning::Found high/critical advisories only in accepted transitive deps ($ACCEPTED package(s): promptfoo/@codecov tree + gray-matter's js-yaml). Not blocking."
          else
            COUNT=$(printf '%s\n' "$ACTIONABLE_PKGS" | sed '/^$/d' | wc -l | tr -d ' ')
            echo "high_count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "::error::High/critical advisories in non-allowlisted packages:"
            printf '%s\n' "$ACTIONABLE_PKGS"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-results
          path: kanon/audit-results.json
          retention-days: 30

      - name: Fail on high or critical vulnerabilities
        if: steps.audit.outputs.high_count > 0
        run: |
          echo "::error::Found high or critical vulnerabilities. Review audit-results artifact."
          exit 1

  secret-scan:
    name: Secret scan (knowledge artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: >
            --source .
            --config .gitleaks.toml
            --redact
            --exit-code 1

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    # Only on schedule and push to main — not on every PR
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # publish_results requires the workflow to run from the repository's
          # default branch; setting it to false avoids the HTTP 400 "workflow
          # verification failed" error while still generating the SARIF report
          # for upload to the GitHub Security tab below.
          publish_results: false

      - name: Upload Scorecard results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
